font_family             Hack
bold_font               auto  
italic_font             auto
bold_italic_font        auto
font_size               11.5
enable_audio_bell       no
remember_window_size    yes

macos_option_as_alt     no

cursor                  #f1f1f1
hide_mouse_when_typing  yes

background              #1d2021
background_opacity      1
background_image        /Users/piotr/Pictures/starship-mars.png
background_tint         0.95
background_image_layout cscaled

foreground              #f7f7f7

selection_foreground    #928374
selection_background    #ebdbb2

# black
color0                  #1d2021
color8                  #7c6f64

# red
color1                  #cc241d
color9                  #fb4934

#: green
color2                  #98971a
color10                 #b8bb26

# yellow
color3                  #d79921
color11                 #fabd2f

# blue
color4                  #458588
color12                 #83a598

# purple
color5                  #b16286
color13                 #d3869b

# aqua
color6                  #689d6a
color14                 #8ec07c

# white
color7                  #a89984
color15                 #fbf1c7

# Map alt + <num> to corresponding tabs
map alt+1              no_op
map alt+2              no_op
map alt+3              no_op
map alt+4              no_op
map alt+5              no_op
map alt+6              no_op
map alt+7              no_op
map alt+8              no_op
map alt+9              no_op
map alt+h              previous_tab
map alt+l              next_tab

# window scroll
map ctrl+u             scroll_page_up
map ctrl+d             scroll_page_down
map ctrl+y             scroll_line_up
map ctrl+e             scroll_line_down

# windows management
map alt+q              close_os_window
map alt+n              new_os_window

# tab management
map alt+c              launch --cwd=current --type=tab
map alt+w              close_tab
map alt+ctrl+,         move_tab_backward
map alt+ctrl+.         move_tab_forward
map alt+,              set_tab_title

# layout management
map alt+[              previous_window
map alt+]              next_window
map alt+r              start_resizing_window
map alt+f              move_window_forward
map alt+b              move_window_backward
map ctrl+alt+l         next_layout
map ctrl+alt+w         close_window 
map ctrl+alt+c         launch --cwd=current --type=window

# Plugins
map ctrl+/        launch --allow-remote-control kitty +kitten kitty_search/search.py @active-kitty-window-id
